name: Update EdNovas Cloud
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
concurrency:
  group: ednovas-release-update
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Prepare candidate without publishing
        id: prepare
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: nix shell --inputs-from . nixpkgs#jq --command bash scripts/ci-update.sh prepare
      - name: Archive exact candidate and local VCS identity
        if: steps.prepare.outputs.changed == 'true'
        run: python3 scripts/candidate.py archive
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: candidate
          path: candidate.tar.gz
          overwrite: true
          retention-days: 14
  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      candidate: true
  publish:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate
      - run: |
          mv candidate.tar.gz /tmp/candidate.tar.gz
          tar -xzf /tmp/candidate.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: validated-candidate
          path: validation-results
      - uses: cachix/install-nix-action@v31
      - name: Publish validated candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: nix shell --inputs-from . nixpkgs#gh nixpkgs#jq nixpkgs#ripgrep --command bash scripts/ci-update.sh publish
