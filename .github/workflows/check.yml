name: Package and runtime checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  status:
    name: ednovas-update/build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: always()
    needs: validate
    steps:
      - name: Require build and every runtime suite
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success
